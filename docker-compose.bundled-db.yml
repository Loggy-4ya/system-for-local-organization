# =============================================================================
# Docker Compose override — bundled MongoDB (local dev)
# =============================================================================
#
# Starts the `db` service (profile bundled-db) and waits for it before web:
#
#   cp .env.vps.example .env.local
#   docker compose -f docker-compose.yml -f docker-compose.bundled-db.yml --profile bundled-db up
#
# External MongoDB (Atlas, remote host) needs only the base file:
#   docker compose up
# =============================================================================

services:
  web:
    depends_on:
      db:
        condition: service_healthy

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      WEB_REPOSITORY_URI: ${{ vars.WEB_REPOSITORY_URI }}
      WORKER_REPOSITORY_URI: ${{ vars.WORKER_REPOSITORY_URI }}
      DEPLOYMENT_BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
      DEPLOYMENT_DOCUMENT: ${{ vars.DEPLOYMENT_DOCUMENT }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}

    steps:
      - name: Validate environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN WEB_REPOSITORY_URI WORKER_REPOSITORY_URI \
            DEPLOYMENT_BUCKET DEPLOYMENT_DOCUMENT INSTANCE_ID DEPLOY_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Environment variable: ${name}"
              exit 1
            fi
          done
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected release SHA format."
            exit 1
          fi

      - name: Check out the validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: nexus-${{ env.DEPLOY_ENVIRONMENT }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity --query Arn --output text

      - name: Authenticate Docker to ECR
        shell: bash
        run: |
          set -euo pipefail
          registry="${WEB_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${registry}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish missing immutable images
        shell: bash
        run: |
          set -euo pipefail

          image_exists() {
            local repository_uri="$1"
            local repository_name="${repository_uri#*/}"
            aws ecr describe-images \
              --repository-name "${repository_name}" \
              --image-ids "imageTag=${RELEASE_SHA}" \
              >/dev/null 2>&1
          }

          if image_exists "${WEB_REPOSITORY_URI}"; then
            echo "Web image ${RELEASE_SHA} already exists; reusing it."
          else
            docker buildx build \
              --platform linux/amd64 \
              --target production \
              --build-arg "NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}" \
              --tag "${WEB_REPOSITORY_URI}:${RELEASE_SHA}" \
              --cache-from "type=gha,scope=nexus-web-${DEPLOY_ENVIRONMENT}" \
              --cache-to "type=gha,mode=max,scope=nexus-web-${DEPLOY_ENVIRONMENT}" \
              --push \
              .
          fi

          if image_exists "${WORKER_REPOSITORY_URI}"; then
            echo "Worker image ${RELEASE_SHA} already exists; reusing it."
          else
            docker buildx build \
              --platform linux/amd64 \
              --target worker \
              --tag "${WORKER_REPOSITORY_URI}:${RELEASE_SHA}" \
              --cache-from "type=gha,scope=nexus-worker-${DEPLOY_ENVIRONMENT}" \
              --cache-to "type=gha,mode=max,scope=nexus-worker-${DEPLOY_ENVIRONMENT}" \
              --push \
              .
          fi

      - name: Publish deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          prefix="s3://${DEPLOYMENT_BUCKET}/releases/${RELEASE_SHA}"
          aws s3 cp scripts/deploy/deployFromEcr.sh "${prefix}/deployFromEcr.sh" --only-show-errors
          aws s3 cp docker-compose.deploy.yml "${prefix}/docker-compose.deploy.yml" --only-show-errors
          aws s3 cp Caddyfile "${prefix}/Caddyfile" --only-show-errors

      - name: Deploy through Systems Manager
        id: ssm
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(
            aws ssm send-command \
              --document-name "${DEPLOYMENT_DOCUMENT}" \
              --instance-ids "${INSTANCE_ID}" \
              --parameters "ReleaseSha=${RELEASE_SHA}" \
              --comment "Nexus ${DEPLOY_ENVIRONMENT} ${RELEASE_SHA}" \
              --query "Command.CommandId" \
              --output text
          )"
          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"

          for attempt in $(seq 1 120); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "${command_id}" \
                --instance-id "${INSTANCE_ID}" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"
            case "${status}" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${command_id}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::SSM deployment did not finish within 10 minutes."
          exit 1

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 \
              "${DEPLOY_URL%/}/api/health" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public health endpoint did not become healthy."
          exit 1

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: mongodb://localhost:27017/nexus-ci
      NEXTAUTH_SECRET: ci-only-placeholder-not-used-outside-the-runner
      NEXTAUTH_URL: http://localhost:3000
      MEDIA_STORAGE_DRIVER: local
      NEXUS_HOSTING_MODE: vps

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run registered unit suites
        run: npm test

      - name: Build Next.js standalone output
        run: npm run build

      - name: Synthesize and security-check AWS infrastructure
        run: npm run infra:synth

      - name: Build production web image
        run: docker build --target production --tag nexus-web:ci .

      - name: Build Telegram worker image
        run: docker build --target worker --tag nexus-worker:ci .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan committed history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

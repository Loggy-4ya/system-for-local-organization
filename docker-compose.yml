services:
  # ── Next.js web application ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:3000"
    volumes:
      # Mount source for hot-reload; exclude node_modules to preserve container copy
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXUS_HOSTING_MODE=vps
      - SCHEDULED_EVENTS_TICK_INTERVAL_SECONDS=15
    env_file:
      - .env.local
    restart: unless-stopped

  # ── MongoDB database (optional — local dev only) ───────────────────────────
  # Bundled dev: docker compose -f docker-compose.yml -f docker-compose.bundled-db.yml --profile bundled-db up
  # External DB: docker compose up  (set MONGODB_URI in .env.local — see .env.vps-external-db.example)
  db:
    profiles: ["bundled-db"]
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - nexus_mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nexus
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MTProto telegram-worker (optional — auto-create project groups) ─────────
  # Start with: docker compose --profile telegram-worker up
  telegram-worker:
    profiles: ["telegram-worker"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run worker:telegram
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  nexus_mongo_data:
    driver: local

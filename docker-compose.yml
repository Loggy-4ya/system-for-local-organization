services:
  # ── Next.js web application ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:3000"
    volumes:
      # Mount source for hot-reload; exclude node_modules to preserve container copy
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://db:27017/nexus
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── MongoDB database ────────────────────────────────────────────────────────
  db:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - nexus_mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nexus
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  nexus_mongo_data:
    driver: local
